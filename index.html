<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diasporact</title>
<meta name="description" content="Diasporact, l’espace de coordination de la diaspora mauritanienne : canaux, projets, entraide et annonces officielles.">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diasporact">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Mise en page : colonne mobile centrée (480px max), barre haute, vue défilante, barre d'onglets flottante.
   Identité : fond blanc ; vert = action et validation, jaune = en attente, rouge = officiel et urgent
   (couleurs du drapeau). Motif de losanges réservé au bandeau d'accueil. Deux thèmes au choix du membre : Blanc (par défaut) et Noir. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F3F6F2; --ink:#15231B; --ink2:#55655C; --line:#DDE5DE;
  --green:#00843A; --green-ink:#006B2F; --green-soft:#E3F4E9; --on-green:#FFFFFF;
  --yellow:#FFC72C; --yellow-ink:#6B4F00; --yellow-soft:#FFF3C4; --on-yellow:#2B2200;
  --red:#D01C1F; --red-ink:#B3171B; --red-soft:#FCE4E2;
  --hero-a:#00843A; --hero-b:#00632B; --hero-ink:#FFFFFF; --hero-soft:#EAF8EF;
  --shadow:0 1px 2px rgba(21,35,27,.05),0 4px 14px rgba(21,35,27,.07);
  --f-display:"Bricolage Grotesque","Noto Sans Arabic",system-ui,sans-serif;
  --f-body:"Inter","Noto Sans Arabic",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1511; --surface:#16201A; --surface2:#1D2A22; --ink:#EEF4EF; --ink2:#A3B5A9; --line:#2A3A30;
  --green:#2BC46F; --green-ink:#5FDB97; --green-soft:#14311F; --on-green:#04210F;
  --yellow:#FFC72C; --yellow-ink:#FFD96A; --yellow-soft:#3A2F0B; --on-yellow:#2B2200;
  --red:#D63638; --red-ink:#FF8A8C; --red-soft:#3E1A1B;
  --hero-a:#0C5A2C; --hero-b:#083D1E; --hero-ink:#FFFFFF; --hero-soft:#CFEBDA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
.ic{flex:none}
.muted{color:var(--ink2)}
.small{font-size:12px}
[lang="ar"] .eyebrow,[lang="ar"] .tab-l{letter-spacing:0}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px}
.topbar h1{font:700 17px/1.2 var(--f-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:34px;height:34px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface2)}
.flip{display:inline-flex}
[dir="rtl"] .flip svg{transform:scaleX(-1)}
.demo-chip{border:1px dashed var(--yellow);color:var(--yellow-ink);border-radius:999px;padding:5px 11px;font:600 12px var(--f-body);flex:none}
.me-btn{flex:none;border-radius:50%}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:16px;padding-bottom:6px;scrollbar-width:thin}
#view>*{flex:none}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:5px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:15px;color:var(--ink2);min-width:0}
.tab-l{font:600 11px var(--f-body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-current="page"]{background:var(--green-soft);color:var(--green-ink)}
.badge{position:absolute;top:3px;inset-inline-end:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/17px var(--f-body);text-align:center;padding:0 4px}

/* Typo */
.h2{font:700 16px/1.25 var(--f-display);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.h3{font:700 14px/1.3 var(--f-display)}
h1.page{font:700 24px/1.15 var(--f-display);text-wrap:balance}
.eyebrow{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.count{background:var(--green);color:var(--on-green);border-radius:999px;padding:0 8px;font:700 12px/20px var(--f-body)}
.empty{padding:18px 14px;border:1px dashed var(--line);border-radius:14px;color:var(--ink2);text-align:center}
.lead{color:var(--ink2);font-size:15px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;text-align:center}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--green);border-color:var(--green-ink);color:var(--on-green)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red-ink)}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.s8{gap:8px}

/* Pastilles */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font:600 12px/20px var(--f-body);background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.yellow{background:var(--yellow-soft);color:var(--yellow-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.urgent{background:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card.list{padding:0;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;min-width:0}
.li+.li{border-top:1px solid var(--line)}
button.li:hover,button.card:hover{background:var(--surface2)}
.li .ico{width:36px;height:36px;border-radius:11px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;flex:none}
.li .t{font-weight:600;overflow-wrap:anywhere}
.ann{border-inline-start:4px solid var(--red);display:flex;flex-direction:column;gap:8px}
.ann h3{font:700 16px/1.3 var(--f-display)}
.ann p{overflow-wrap:anywhere}
.pcard{display:flex;flex-direction:column;gap:10px;width:100%;text-align:start}
.pcard h3{font:700 16px/1.3 var(--f-display);overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);width:var(--w,0%);border-radius:99px}
.av{width:var(--s,30px);height:var(--s,30px);border-radius:50%;background:var(--green);color:var(--on-green);display:inline-grid;place-items:center;font:700 13px var(--f-body);flex:none}
.av.y{background:var(--yellow);color:var(--on-yellow)}
.av.r{background:var(--red);color:#fff}

/* Bandeau d'invitation */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:30px 18px 28px;background:linear-gradient(var(--red),var(--red)) top/100% 8px no-repeat,linear-gradient(var(--red),var(--red)) bottom/100% 8px no-repeat,linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);display:flex;flex-direction:column;gap:10px}
.hero::before{content:"";position:absolute;inset:8px 0;pointer-events:none;background-image:
  repeating-linear-gradient(45deg,rgba(255,199,44,.3) 0 1.5px,transparent 1.5px 30px),
  repeating-linear-gradient(-45deg,rgba(255,199,44,.3) 0 1.5px,transparent 1.5px 30px)}
.hero>*{position:relative}
.hero h1{font:700 27px/1.12 var(--f-display);text-wrap:balance}
.hero .eyebrow{color:var(--hero-soft)}
.hero p{color:var(--hero-soft)}
.hero .logo{width:44px;height:44px}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:600;font-size:13px}
input[type=text],input[type=date],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:16px/1.4 var(--f-body)}
textarea{resize:vertical;min-height:84px}
.pfx{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding-inline-start:12px;color:var(--ink2);font-size:16px}
.pfx:focus-within{outline:2px solid var(--green)}
.pfx input{border:0;border-radius:0 12px 12px 0;background:transparent;outline:0}
[dir="rtl"] .pfx input{border-radius:12px 0 0 12px}
.fb{min-height:22px;font-size:13px}
.fb.ok{color:var(--green-ink)}
.fb.err{color:var(--red-ink)}
.pick{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer}
.pick:has(input:checked){border-color:var(--green-ink);background:var(--green-soft)}
.pick input{width:20px;height:20px;accent-color:var(--green-ink);flex:none}
.pick .ico{width:38px;height:38px;border-radius:12px;background:var(--surface2);color:var(--green-ink);display:grid;place-items:center;flex:none}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:600;text-align:center}
.seg [aria-pressed="true"],.seg [aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-weight:600;background:var(--surface)}
.tabs [aria-selected="true"]{background:var(--green);color:var(--on-green);border-color:var(--green-ink)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .15s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{inset-inline-start:21px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--yellow-soft);color:var(--yellow-ink);font-weight:500}
.banner.info{background:var(--green-soft);color:var(--green-ink)}
.linkbox{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}
.code{font:700 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;text-align:center;background:var(--surface2);border-radius:14px;padding:16px 10px;overflow-wrap:anywhere}

/* Projets */
.tk{display:flex;align-items:center;gap:10px;padding:10px 0}
.tk+.tk{border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2);flex:none}
.dot.doing{border-color:var(--yellow);background:var(--yellow)}
.dot.done{border-color:var(--green-ink);background:var(--green)}
.ms{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ms .dot{margin-top:5px}
.cmt{display:flex;gap:10px;padding:10px 0}
.cmt+.cmt{border-top:1px solid var(--line)}
.cmt p{overflow-wrap:anywhere}
.who{font-weight:600}
.rad{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;width:100%}
.rad[aria-checked="true"]{border-color:var(--green-ink);background:var(--green-soft)}
.rad .o{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink2);flex:none}
.rad[aria-checked="true"] .o{border-color:var(--green-ink);background:radial-gradient(var(--green) 45%,transparent 50%)}

/* Fenêtres */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.55);z-index:40}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;max-width:480px;margin-inline:auto;max-height:90%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.tall{height:90%}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.ico-lg{width:44px;height:44px;border-radius:13px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;flex:none}
.sheet-h h2{font:700 17px/1.25 var(--f-display)}
.sheet-b{overflow-y:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;inset-inline:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--green);color:var(--on-green);padding:10px 16px;border-radius:13px;box-shadow:var(--shadow);z-index:60;font-weight:500}

/* Simulation WhatsApp */
.chat{background:var(--surface2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:90%;background:var(--surface);border-radius:4px 14px 14px 14px;padding:8px 11px;box-shadow:var(--shadow);align-self:flex-start;min-width:0}
.bub.out{align-self:flex-end;background:var(--green-soft);border-radius:14px 4px 14px 14px}
.bub .who{font-size:12px;color:var(--green-ink)}
.bub p{overflow-wrap:anywhere}
.lc{margin-top:6px;border-inline-start:3px solid var(--green);background:var(--surface2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.lc b{font-weight:700}
.lc .url{font-size:12px;color:var(--ink2)}
.lc button{margin-top:6px;align-self:flex-start;font-weight:700;color:var(--green-ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* IA simulée */
.ai-card{border:1.5px dashed var(--green);background:var(--surface)}
.chip.ai{background:var(--green-soft);color:var(--green-ink)}
.tr-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.lnk{background:none;border:0;color:var(--green-ink);text-decoration:underline;font:600 13px var(--f-body);padding:4px;cursor:pointer}
.reply{border-inline-start:3px solid var(--green);padding:8px 10px;background:var(--green-soft);border-radius:10px;white-space:pre-line}
.bubble{background:var(--green-soft);border-radius:14px;padding:10px 12px;white-space:pre-line;color:var(--ink)}
.lcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--surface)}
.dg{margin:0;padding-inline-start:18px;display:grid;gap:6px}
.chat-ta{min-height:200px}
.bdgs{display:inline-flex;gap:4px;vertical-align:middle;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:0 7px;font:600 10.5px/17px var(--f-body);background:var(--surface2);color:var(--ink2);white-space:nowrap}
.bdg.green{background:var(--green-soft);color:var(--green-ink)}
.bdg.yellow{background:var(--yellow-soft);color:var(--yellow-ink)}
.bdg.red{background:var(--red-soft);color:var(--red-ink)}
.dots{color:var(--yellow-ink);font-size:11px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;min-height:92px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;text-align:start}
.tile:hover{background:var(--surface2)}
.tile .ico{width:36px;height:36px;border-radius:11px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center}
.lang-btn{font:700 14px var(--f-body)}
.li.done .t{color:var(--ink2);text-decoration:line-through}
.li.done .ico{background:var(--green);color:var(--on-green)}
.tabs{-webkit-mask-image:linear-gradient(to var(--end,right),#000 92%,transparent);mask-image:linear-gradient(to var(--end,right),#000 92%,transparent)}
[dir="rtl"] .tabs{--end:left}
</style>

</head>

/* Discussion -> projet */
function analyzeChat(txt){
  var msgs=txt.split(/\n+/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){var m=l.match(/^([^:]{1,30}?)\s*:\s*(.+)$/);return m?{a:m[1].trim().toLowerCase().replace(/\s+/g,'.'),t:m[2].trim()}:{a:'',t:l};});
  var R={title:'',obj:'',needs:[],actions:[],decisions:[],questions:[]};
  function clean(x){return x.replace(/[.\s]+$/,'');}
  msgs.forEach(function(m){
    if(/je prends|je peux|je m[’']occupe|je lui demande|je contacte|il faut|il faudra/i.test(m.t))R.actions.push({t:clean(m.t),who:m.a,sel:true});
    else if(/\?/.test(m.t))R.questions.push(m.t);
    else if(/c[’']est d[ée]cid[ée]|on d[ée]cide|d[’']accord|ok pour|valid[ée]/i.test(m.t))R.decisions.push(m.t);
  });
  var all=msgs.map(function(m){return m.t;}).join(' ');
  R.title=/ka[ée]di/i.test(all)&&/livre/i.test(all)?'Collecte de livres pour la bibliothèque de Kaédi':(msgs[0]?clean(msgs[0].t).replace(/\?$/,'').slice(0,70):'');
  R.obj=R.decisions[0]||(msgs[0]?msgs[0].t:'');
  [[/transport|conteneur|exp[ée]di/i,'Transport'],[/livre|\bdons?\b|mat[ée]riel/i,'Dons'],[/financ|€|euro|budget/i,'Financement'],[/traduct/i,'Traduction'],[/m[ée]decin|sant[ée]/i,'Médecins'],[/r[ée]ceptionn|conna[iî]t quelqu/i,'Relais local pour réceptionner']].forEach(function(x){if(x[0].test(all))R.needs.push(x[1]);});
  return R;
}

function statsOf(p){
  var me=p===S.me.pseudo,b=(me?S.me.base:STATS[p])||{};
  var st={reads:b.reads||0,tasks:b.tasks||0,proj:b.proj||0,help:b.help||0,links:b.links||0};
  if(me){
    st.reads+=Object.keys(S.read).filter(function(k){return S.read[k];}).length;
    S.projects.forEach(function(pr){st.tasks+=pr.tasks.filter(function(k){return k.who===p&&k.status==='done';}).length;if(pr.owner===p&&pr.id.charAt(0)==='p'&&/^p\d/.test(pr.id))st.proj++;});
    st.help+=S.helps.filter(function(h){return h.by===p&&h.status==='solved';}).length;
    st.links+=Object.keys(S.proposed).length;
  }
  return st;
}
function lvl(b,st){var n=0;b.lv.forEach(function(x,i){if(st[b.m]>=x)n=i+1;});return n;}
function pts(st){return st.tasks*3+st.help*5+st.proj*4+st.reads+st.links*2;}

  var ts=[['life','new-help','th_help'],['folder','new-project','th_proj'],['spark','new-chat','th_chat'],S.me.speaker?['mega','publish-ann','publish_ann']:['hash','tab','th_canals']];
  return '<section><h2 class="h2">'+T('act_title')+'</h2><div class="tiles">'+ts.map(function(x){return '<button class="tile" data-act="'+x[1]+'"'+(x[1]==='tab'?' data-tab="canals"':'')+'><span class="ico">'+ic(x[0],20)+'</span>'+T(x[2])+'</button>';}).join('')+'</div></section>';
}
function startCard(){
  if(S.hideStart)return '';
  var mem=Object.keys(S.mem),isM=mem.some(isMember),pend=!isM&&mem.length>0;
  var it=[
   {d:isM,t:pend?t('fs_1p'):t('fs_1'),a:'tab',tab:'canals'},
   {d:Object.keys(S.read).length>0||!!(S.me.base&&S.me.base.reads>0),t:t('fs_2'),a:'scroll-ann'},
   {d:S.projects.some(function(p){return p.owner===S.me.pseudo||p.tasks.some(function(k){return k.who===S.me.pseudo;});}),t:t('fs_3'),a:'tab',tab:'projects'},
   {d:S.me.skills.length>0,t:t('fs_4'),a:'go-me'}];
  var n=it.filter(function(x){return x.d;}).length;if(n===it.length)return '';
  return '<section class="stack s8"><div class="row between"><h2 class="h2" style="margin:0">'+T('fs_title')+'</h2><button class="lnk" data-act="hide-start">'+T('fs_hide')+'</button></div><p class="muted small">'+T('fs_sub')+'</p><div class="bar" aria-hidden="true"><i style="--w:'+Math.round(n/it.length*100)+'%"></i></div><p class="muted small">'+T('fs_prog',{a:n,b:it.length})+'</p>'+
  '<div class="card list">'+it.map(function(x,i){return '<button class="li'+(x.d?' done':'')+'" data-act="'+x.a+'"'+(x.tab?' data-tab="'+x.tab+'"':'')+'><span class="ico">'+(x.d?ic('check',18):'<b>'+(i+1)+'</b>')+'</span><span class="grow t">'+esc(x.t)+'</span><span class="flip muted">'+ic('chev',18)+'</span></button>';}).join('')+'</div></section>';
}
function projListHtml(){
  var list=S.projects.filter(function(p){return isMember(p.canal);}),shown=S.projTab==='mine'?list.filter(myProject):list,q=(S.projQ||'').trim().toLowerCase();
  if(q)shown=shown.filter(function(p){return (p.t.fr+' '+p.t.ar+' '+p.needs.join(' ')+' '+c(canalOf(p.canal).n)).toLowerCase().indexOf(q)>-1;});
  if(!shown.length)return q?'<p class="empty">'+T('search_none')+'</p>':(S.projTab==='mine'?'<div class="empty">'+T('proj_none_mine')+'<br><button class="btn sm" style="margin-top:8px" data-act="proj-tab" data-tab="all">'+T('proj_see_all')+'</button></div>':'<p class="empty">'+T('no_proj')+'</p>');
  return shown.map(projCard).join('');
}

function annCard(a,ro){
  var n=a.reads+(S.read[a.id]?1:0);

  h+='<h3>'+C(a.t)+'</h3>'+trBlock('a:'+a.id,a.body);

  h+='<div class="row between wrap"><span class="muted small">'+n+' '+T('reads')+'</span>';

   '<div class="bar" aria-hidden="true"><i style="--w:'+pr.pct+'%"></i></div><div class="row between muted small"><span>'+T('tasks_count',{a:pr.d,b:pr.n})+'</span><span>@'+esc(p.owner)+'</span></div></button>';

function todoItems(){
  var out=[];
  Object.keys(S.mem).forEach(function(id){if(S.mem[id]==='pending')out.push({ico:'clock',title:T('todo_pending',{x:c(canalOf(id).n)}),sub:T('todo_pending_sub'),act:'open-canal',data:{id:id}});});
  S.projects.forEach(function(p){p.tasks.forEach(function(k){if(k.who===S.me.pseudo&&k.status!=='done')out.push({ico:'check',title:T('todo_task',{x:k.t}),sub:C(p.t),act:'open-project',data:{id:p.id}});});});
  S.me.mod.forEach(function(id){var n=(S.reqs[id]||[]).length;if(n)out.push({ico:'people',title:T('todo_reqs',{x:n}),sub:C(canalOf(id).n),act:'open-canal',data:{id:id,tab:'mod'}});});
  if(S.me.ref.length){var n2=refQueue().filter(function(h){return h.status==='open';}).length;if(n2)out.push({ico:'life',title:T('todo_help',{x:n2}),sub:S.me.ref.map(function(d){return t('dm_'+d);}).map(esc).join(', '),act:'tab',data:{tab:'help'}});}
  return out;
}

function vProject(p){

    h+=hasAccount()?(mem(pj.canal)==='pending'?'':'<button class="btn primary block" data-act="join" data-id="'+k.id+'">'+T('canal_join')+'</button>'):'<button class="btn primary block" data-act="wa-invite">'+T('canal_join')+'</button>';

  if(inTeam)h+=chip(T('in_team'),'green');else if(S.applied[pj.id])h+=chip(ic('check',14)+T('applied'),'green');else h+='<button class="btn sm primary" data-act="apply" data-id="'+pj.id+'">'+T('apply')+'</button>';

    return '<div class="tk"><span class="dot '+k2.status+'"></span><span class="grow"><span class="t">'+esc(k2.t)+'</span><br><span class="muted small">'+(k2.who?'@'+esc(k2.who):T('unassigned'))+'</span></span>'+act+'</div>';}).join('')+'</section>';

function helpCard(hq,mode){

  h+='<p>'+esc(hq.txt)+'</p><p class="muted small">'+(mode==='ref'?'@'+esc(hq.who)+' · ':'')+esc(hq.country)+(hq.by?' · '+T('by',{x:hq.by}):'')+'</p>';

  return h+'</article>';
}

function render(resetScroll){

  root.lang=S.lang;root.dir=S.lang==='ar'?'rtl':'ltr';
  root.setAttribute('data-theme',S.theme==='dark'?'dark':'light');
  var tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute('content',S.theme==='dark'?'#0E1511':'#FFFFFF');
  var onb=r.indexOf('inv')===0,detail=['canal','project','newProject','newHelp','me','inv2','chat'].indexOf(r)>-1&&(S.stack.length>0||(r==='project'&&!acct));
  var tb=(detail?'<button class="icon-btn flip" data-act="back" aria-label="'+T('back')+'">'+ic('back',22)+'</button>':logoSvg())+'<h1>'+esc(titleFor(r,p))+'</h1><button class="demo-chip" data-act="demo">'+T('demo')+'</button><button class="icon-btn lang-btn" data-act="toggle-lang" aria-label="'+esc(S.lang==='ar'?'Français':'العربية')+'">'+(S.lang==='ar'?'FR':'ع')+'</button><button class="icon-btn" data-act="toggle-theme" aria-label="'+esc(S.theme==='dark'?t('th_light'):t('th_dark'))+'">'+ic(S.theme==='dark'?'sun':'moon',20)+'</button>'+(acct&&!onb?'<button class="icon-btn me-btn" data-act="go-me" aria-label="'+T('my_account')+'">'+av(S.me.pseudo,32)+'</button>':'');
  $('#topbar').innerHTML=tb;
  var view=$('#view'),y=view.scrollTop;
  view.innerHTML=(VIEWS[r]||vHome)(p);
  view.scrollTop=resetScroll?0:y;
  var bar=$('#tabbar');
  if(acct&&!onb){bar.hidden=false;var cur=tabOf(r),un=unread();bar.innerHTML=TABS.map(function(x){return '<button class="tab" data-act="tab" data-tab="'+x[0]+'"'+(cur===x[0]?' aria-current="page"':'')+'>'+ic(x[1],22)+'<span class="tab-l">'+T(x[2])+'</span>'+tabBadge(x[0],un)+'</button>';}).join('');}

}
function mount(r){
  var tbs=document.querySelector('.tabs'),at=tbs&&tbs.querySelector('[aria-selected="true"]');if(at&&root.dir!=='rtl')tbs.scrollLeft=at.offsetLeft-tbs.clientWidth/2+at.offsetWidth/2;
  if(r==='inv1'){updatePseudo();}
  if(r==='inv2'){updatePick();}
}
function checkPseudo(v){
  v=v.trim().toLowerCase();if(!v)return {st:'empty',v:v};
  if(!/^[a-z0-9._-]{3,20}$/.test(v))return {st:'bad',v:v};
  if(TAKEN.indexOf(v)>-1)return {st:'taken',v:v,sug:[v+'.mr',v+'_2026'].filter(function(s){return s.length<=20&&TAKEN.indexOf(s)<0;})};
  return {st:'ok',v:v};
}
function updatePseudo(){
  var inp=$('#pseudo');if(!inp)return;var r=checkPseudo(inp.value),fb=$('#pseudo-fb'),go=$('#pseudo-go');S.draft.pseudo=inp.value;
  fb.className='fb';
  if(r.st==='ok'){fb.classList.add('ok');fb.textContent='✓ '+t('pseudo_ok',{p:r.v});}
  else if(r.st==='bad'){fb.classList.add('err');fb.textContent=t('pseudo_bad');}
  else if(r.st==='taken'){fb.classList.add('err');fb.innerHTML=esc(t('pseudo_taken',{p:r.v}))+' '+r.sug.map(function(s){return '<button type="button" class="chip" data-act="sug" data-v="'+esc(s)+'">@'+esc(s)+'</button>';}).join(' ');}
  else fb.textContent='';
  go.disabled=r.st!=='ok';
}
function updatePick(){var n=document.querySelectorAll('#view input[type=checkbox]:checked').length,b=$('#pick-go');if(b)b.disabled=n<1;}

 refuse:function(d){addMember(d.id,d.p);toast(t('t_refused',{p:d.p}));render();},
 take:function(d){var p=projOf(d.id),k=p.tasks.filter(function(x){return x.id===d.task;})[0];k.who=S.me.pseudo;k.status='doing';if(p.team.indexOf(S.me.pseudo)<0)p.team.push(S.me.pseudo);toast(t('t_took'));render();},
 finish:function(d){var p=projOf(d.id),k=p.tasks.filter(function(x){return x.id===d.task;})[0];k.status='done';toast(t('t_done'));render();},
 apply:function(d){var p=projOf(d.id);S.applied[d.id]=true;toast(t('t_applied',{o:p.owner}));render();},
 'follow-sheet':function(d){openFollow(d.id);},
 'pick-follow':function(d){S.follow[d.id]=d.v;closeSheet();render();},
 'new-project':function(d){go('newProject',{canal:d.id});},
 'new-help':function(){go('newHelp');},
 claim:function(d){var h=S.helps.filter(function(x){return x.id===d.id;})[0];h.status='doing';h.by=S.me.pseudo;toast(t('t_claimed',{p:h.who}));render();},
 solve:function(d){var h=S.helps.filter(function(x){return x.id===d.id;})[0];h.status='solved';toast(t('t_solved'));render();},
 'toggle-push':function(){S.push=!S.push;if(S.push)toast(t('t_push_on'));render();},
 'toggle-digest':function(){S.digest=!S.digest;render();},
 'mark-all':function(){S.notifs.forEach(function(n){n.read=true;});render();},
 'alert-open':function(d){var n=S.notifs.filter(function(x){return x.id===d.id;})[0];n.read=true;if(n.route&&n.route!=='home')go(n.route,n.params);else render();},
 lang:function(d){S.lang=d.v;render();},
 theme:function(d){S.theme=d.v==='dark'?'dark':'light';saveTheme(S.theme);render();},
 'toggle-theme':function(){S.theme=S.theme==='dark'?'light':'dark';saveTheme(S.theme);render();},
 logout:function(){confirmSheet(t('logout'),t('cf_logout'),'logout-ok','');},
 'logout-ok':function(){closeSheet(true);preset('visitor');},
 'publish-ann':function(){openAnnForm();},
 sug:function(d){var i=$('#pseudo');i.value=d.v;updatePseudo();i.focus();},
 enter:function(){S.stack=[];S.route={name:'home',params:{}};render(true);},
 'wa-group':function(){openWA();},
 'wa-invite':function(){closeSheet(true);S.stack=[];if(hasAccount()){S.route={name:'canal',params:{id:'edu'}};render(true);}else{S.route={name:'inv1',params:{}};render(true);}},
 'wa-project':function(){closeSheet(true);S.stack=[];S.route={name:'project',params:{id:'ecole-boghe'}};render(true);},
 preset:function(d){closeSheet(true);preset(d.v);},
 'sim-wa':function(){openWA();},
 'sim-accept':function(){closeSheet(true);var any=false;Object.keys(S.mem).forEach(function(id){if(S.mem[id]==='pending'){S.mem[id]='member';any=true;var k=canalOf(id);notify(I18N.fr.n_acc.replace('{x}',k.n.fr),I18N.ar.n_acc.replace('{x}',k.n.ar),'canal',{id:id},'canal');}});toast(any?t('nav_alerts')+' · '+t('now'):'—');render();},
 'sim-milestone':function(){closeSheet(true);simUpdate('milestone');},
 'sim-comment':function(){closeSheet(true);simUpdate('comment');},
 'new-chat':function(){S.chatResult=null;go('chat');},
 'chat-sample':function(){S.chatDraft=CHAT_SAMPLE;render();},
 'chat-analyze':function(){
   var el=$('#ch-txt');if(el)S.chatDraft=el.value;
   if(!S.chatDraft.trim()){toast(t('chat_empty'));return;}
   S.chatLoading=true;render();
   setTimeout(function(){S.chatResult=analyzeChat(S.chatDraft);S.chatLoading=false;if(S.route.name==='chat')render(true);},900);
 },
 'cr-add':function(d){syncChat();var R=S.chatResult,el=$('#cr-add-'+d.k),v=el?el.value.trim():'';if(!v)return;if(d.k==='actions')R.actions.push({t:v,who:S.me.pseudo,sel:true});else R[d.k].push(v);render();var n=$('#cr-add-'+d.k);if(n)n.focus();},
 'cr-del':function(d){syncChat();S.chatResult[d.k].splice(+d.i,1);render();},
 'chat-reset':function(){S.chatResult=null;render(true);},
 tr:function(d){S.tr[d.k]=!S.tr[d.k];render();},
 dictate:function(d){dictate(d.id);},
 propose:function(d){S.proposed[d.id+'|'+d.p]=true;toast(t('match_sent',{x:d.p}));render();},
 'toggle-matching':function(){S.me.matching=!S.me.matching;render();},
 'dg-freq':function(d){S.digestFreq=d.v;render();},
 'dg-wa':function(){openDigestWA();},
 'ai-dom':function(d){var e=$('#nh-dom');if(e)e.value=d.v;updateHelpAI();},
 'ai-urg':function(){var e=$('#nh-urg');if(e)e.value='1';updateHelpAI();},
 'faq-solved':function(){toast(t('ai_help_ok_t'));back();},
 'open-faq':function(d){openFaq(d.id);},
 draft:function(d){openDraft(d.id);},
 'toggle-lang':function(){S.lang=S.lang==='ar'?'fr':'ar';render();},
 'hide-start':function(){S.hideStart=true;render();},
 'scroll-ann':function(){var e=$('#ann-sec');if(e)e.scrollIntoView({behavior:'smooth',block:'start'});},
 'badge-req':function(){openBadgeReq();},
 'toggle-honor':function(){S.me.showHonor=!S.me.showHonor;render();},
 'badge-grant':function(d){var r=S.badgeReqs.filter(function(x){return x.id===d.id;})[0];if(!r)return;var g=S.grants[r.p]=S.grants[r.p]||{};if(r.type==='relay')g.relay=true;else g.expert=r.type.split(':')[1];S.badgeReqs=S.badgeReqs.filter(function(x){return x!==r;});toast(t('bd_granted',{x:r.p}));render();},
 'badge-deny':function(d){S.badgeReqs=S.badgeReqs.filter(function(x){return x.id!==d.id;});toast(t('bd_denied'));render();}
};
function simUpdate(kind){
  var p=projOf('ecole-boghe'),f=S.follow[p.id]||'all';
  if(!hasAccount()||!isMember(p.canal)){toast('—');return;}
  if(f==='none'||(f==='milestones'&&kind!=='milestone')){toast(t('t_no_notif'));return;}
  if(kind==='milestone'){var ms=p.ms.filter(function(m){return !m.done;})[0];if(ms){ms.done=true;notify(I18N.fr.n_mil.replace('{x}',ms.t),I18N.ar.n_mil.replace('{x}',c(p.t)),'project',{id:p.id},'info');}}
  else{p.cmts.push({by:'mariem.paris',t:'Les plans de la salle sont partagés dans le dossier du projet.',at:Date.now()});notify(I18N.fr.n_cmt.replace('{x}',p.t.fr),I18N.ar.n_cmt.replace('{x}',p.t.ar),'project',{id:p.id},'info');}
  toast(t('now')+' · '+t('nav_alerts'));render();
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var fn=ACT[el.dataset.act];if(!fn)return;
  fn(el.dataset,el,e);
  if(checkBadges())render();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheets').hidden)closeSheet();if(e.key==='Enter'&&/^cr-add-/.test(e.target.id||'')){e.preventDefault();var b=document.querySelector('[data-act=cr-add][data-k='+e.target.id.slice(7)+']');if(b)b.click();}});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='pseudo')updatePseudo();
  if(id==='proj-q'){S.projQ=e.target.value;var pl=$('#proj-list');if(pl)pl.innerHTML=projListHtml();}
  if(id==='ch-txt')S.chatDraft=e.target.value;
  if(id==='nh-txt')updateHelpAI();
  if(id==='cmt-text'){var n=$('#cmt-n');if(n)n.textContent=e.target.value.length+'/280';}
});
document.addEventListener('change',function(e){
  if(e.target.closest('[data-form="canals"]'))updatePick();
  if(e.target.id==='nh-dom'||e.target.id==='nh-urg')updateHelpAI();
  if(e.target.id==='noted'){var b=$('#enter');if(b)b.disabled=!e.target.checked;}
});
function need(id,errId,msgKey){var el=$('#'+id);if(!el||!el.value.trim()){var e=$('#'+errId);if(e)e.textContent=t(msgKey||'req');if(el)el.focus();return null;}return el.value.trim();}
var FORMS={
 badgereq:function(){var n=$('#bq-note').value.trim();if(!n){$('#bq-note').focus();return;}S.badgeReqs.push({id:'br'+Date.now(),p:S.me.pseudo,type:$('#bq-type').value,note:n});closeSheet(true);toast(t('bd_sent'));render();},
 skills:function(){S.me.skills=$('#sk-in').value.split(',').map(function(x){return x.trim();}).filter(Boolean).slice(0,8);toast(t('sk_saved'));render();},
 draftsend:function(f){
   var txt=$('#dr-txt').value.trim();if(!txt)return;
   var h=S.helps.filter(function(x){return x.id===f.dataset.id;})[0];if(!h)return;
   h.reply={by:S.me.pseudo,txt:txt};h.status='doing';h.by=S.me.pseudo;
   if($('#dr-faq').checked)S.faqx.push({id:'x'+Date.now(),dom:h.dom,kw:null,by:S.me.pseudo,t:{fr:t('dm_'+h.dom),ar:t('dm_'+h.dom)},s:{fr:txt,ar:txt}});
   closeSheet(true);toast(t('draft_sent',{x:h.who}));render();
 },
 chatproj:function(){
   var title=need('cr-title','cr-err'),obj=title&&need('cr-obj','cr-err');if(!title||!obj)return;
   var R=S.chatResult,needs=$('#cr-needs').value.split(',').map(function(x){return x.trim();}).filter(Boolean);
   var acts=[].slice.call(document.querySelectorAll('.cr-act:checked')).map(function(i){return R.actions[+i.value];});
   var tasks=acts.map(function(a,i){var mine=a.who===S.me.pseudo;return {id:'k'+(i+1),t:a.t+(a.who&&!mine?' ('+t('cr_by',{x:a.who})+')':''),status:mine?'doing':'todo',who:mine?S.me.pseudo:null};});
   var cm=[];
   if(R.decisions.length)cm.push({by:S.me.pseudo,t:(t('ch_decisions')+R.decisions.join(' · ')).slice(0,280),at:Date.now()});
   if(R.questions.length)cm.push({by:S.me.pseudo,t:(t('ch_questions')+R.questions.join(' · ')).slice(0,280),at:Date.now()});
   var id='p'+Date.now();
   S.projects.unshift({id:id,canal:$('#cr-canal').value,t:{fr:title,ar:title},owner:S.me.pseudo,status:'recruit',obj:obj,needs:needs,ms:[],tasks:tasks,team:[S.me.pseudo],cmts:cm});
   S.chatResult=null;S.chatDraft='';S.stack.pop();S.route={name:'project',params:{id:id}};render(true);toast(t('t_proj_pub'));openShare('project',id);
 },
 pseudo:function(){
   var r=checkPseudo($('#pseudo').value);if(r.st!=='ok')return;
   S.draft.pseudo=r.v; /* le compte n'existe qu'après l'envoi des demandes */
   go('inv2');
 },
 canals:function(){
   var ids=[].slice.call(document.querySelectorAll('#view input[type=checkbox]:checked')).map(function(x){return x.value;});if(!ids.length)return;
   S.me.pseudo=S.draft.pseudo.trim().toLowerCase();S.me.code=genCode();
   ids.forEach(function(id){S.mem[id]='pending';});
   S.notifs=[];notify(I18N.fr.n_welcome,I18N.ar.n_welcome,'home',{},'info');
   go('inv3');
 },
 comment:function(f){
   var el=$('#cmt-text'),v=el.value.trim();if(!v)return;var p=projOf(f.dataset.id);
   p.cmts.push({by:S.me.pseudo,t:v,at:Date.now()});render();
 },
 project:function(){
   var title=need('np-title','np-err'),obj=title&&need('np-obj','np-err');if(!title||!obj)return;
   var needs=$('#np-needs').value.split(',').map(function(s){return s.trim();}).filter(Boolean),canal=$('#np-canal').value,due=$('#np-due').value;
   var id='p'+Date.now();
   S.projects.unshift({id:id,canal:canal,t:{fr:title,ar:title},owner:S.me.pseudo,status:'recruit',obj:obj,needs:needs.length?needs:[],ms:due?[{t:title,date:due,done:false}]:[],tasks:[],team:[S.me.pseudo],cmts:[]});
   S.stack.pop();S.route={name:'project',params:{id:id}};render(true);toast(t('t_proj_pub'));openShare('project',id);
 },
 help:function(){
   var country=need('nh-country','nh-err'),txt=country&&need('nh-txt','nh-err');if(!country||!txt)return;
   S.helps.unshift({id:'h'+Date.now(),who:S.me.pseudo,dom:$('#nh-dom').value,country:country,urgent:$('#nh-urg').value==='1',status:'open',by:null,txt:txt});
   S.stack=[];S.route={name:'help',params:{}};render(true);toast(t('t_help_sent'));
 },
 ann:function(){
   var title=need('an-t','an-err'),body=title&&need('an-b','an-err');if(!title||!body)return;
   var id='a'+Date.now();S.anns.unshift({id:id,canal:$('#an-c').value,t:{fr:title,ar:title},body:body,date:new Date().toISOString().slice(0,10),until:$('#an-u').value,reads:0});
   closeSheet(true);render();toast(t('t_ann_pub'));openShare('ann',id);
 }
};
document.addEventListener('submit',function(e){e.preventDefault();var f=e.target,fn=FORMS[f.getAttribute('data-form')];if(fn){fn(f);if(checkBadges())render();}});

/* Hors ligne (version installable uniquement) */
if('serviceWorker' in navigator&&document.querySelector('link[rel="manifest"]')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});
}

render(true);
})();
