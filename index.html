<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diasporact</title>
<meta name="description" content="Diasporact, l’espace de coordination de la diaspora mauritanienne : canaux, projets, entraide et annonces officielles.">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diasporact">

<link rel="apple-touch-icon" href="icon-192.png">

<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Mise en page : colonne mobile centrée (480px max), barre haute, vue défilante, barre d'onglets flottante.
   Identité : fond blanc ; vert = action et validation, jaune = en attente, rouge = officiel et urgent
   (couleurs du drapeau). Motif de losanges réservé au bandeau d'accueil. Deux thèmes au choix du membre : Blanc (par défaut) et Noir. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F3F6F2; --ink:#15231B; --ink2:#55655C; --line:#DDE5DE;
  --green:#00843A; --green-ink:#006B2F; --green-soft:#E3F4E9; --on-green:#FFFFFF;
  --yellow:#FFC72C; --yellow-ink:#6B4F00; --yellow-soft:#FFF3C4; --on-yellow:#2B2200;
  --red:#D01C1F; --red-ink:#B3171B; --red-soft:#FCE4E2;
  --hero-a:#00843A; --hero-b:#00632B; --hero-ink:#FFFFFF; --hero-soft:#EAF8EF;
  --shadow:0 1px 2px rgba(21,35,27,.05),0 4px 14px rgba(21,35,27,.07);
  --f-display:"Bricolage Grotesque","Noto Sans Arabic",system-ui,sans-serif;
  --f-body:"Inter","Noto Sans Arabic",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1511; --surface:#16201A; --surface2:#1D2A22; --ink:#EEF4EF; --ink2:#A3B5A9; --line:#2A3A30;
  --green:#2BC46F; --green-ink:#5FDB97; --green-soft:#14311F; --on-green:#04210F;
  --yellow:#FFC72C; --yellow-ink:#FFD96A; --yellow-soft:#3A2F0B; --on-yellow:#2B2200;
  --red:#D63638; --red-ink:#FF8A8C; --red-soft:#3E1A1B;
  --hero-a:#0C5A2C; --hero-b:#083D1E; --hero-ink:#FFFFFF; --hero-soft:#CFEBDA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
.ic{flex:none}
.muted{color:var(--ink2)}
.small{font-size:12px}
[lang="ar"] .eyebrow,[lang="ar"] .tab-l{letter-spacing:0}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px}
.topbar h1{font:700 17px/1.2 var(--f-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:34px;height:34px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface2)}
.flip{display:inline-flex}
[dir="rtl"] .flip svg{transform:scaleX(-1)}
.demo-chip{border:1px dashed var(--yellow);color:var(--yellow-ink);border-radius:999px;padding:5px 11px;font:600 12px var(--f-body);flex:none}
.me-btn{flex:none;border-radius:50%}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:16px;padding-bottom:6px;scrollbar-width:thin}
#view>*{flex:none}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:5px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:15px;color:var(--ink2);min-width:0}
.tab-l{font:600 11px var(--f-body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-current="page"]{background:var(--green-soft);color:var(--green-ink)}
.badge{position:absolute;top:3px;inset-inline-end:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/17px var(--f-body);text-align:center;padding:0 4px}

/* Typo */
.h2{font:700 16px/1.25 var(--f-display);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.h3{font:700 14px/1.3 var(--f-display)}
h1.page{font:700 24px/1.15 var(--f-display);text-wrap:balance}
.eyebrow{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.count{background:var(--green);color:var(--on-green);border-radius:999px;padding:0 8px;font:700 12px/20px var(--f-body)}
.empty{padding:18px 14px;border:1px dashed var(--line);border-radius:14px;color:var(--ink2);text-align:center}
.lead{color:var(--ink2);font-size:15px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;text-align:center}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--green);border-color:var(--green-ink);color:var(--on-green)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red-ink)}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.s8{gap:8px}

/* Pastilles */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font:600 12px/20px var(--f-body);background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.yellow{background:var(--yellow-soft);color:var(--yellow-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.urgent{background:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card.list{padding:0;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;min-width:0}
.li+.li{border-top:1px solid var(--line)}
button.li:hover,button.card:hover{background:var(--surface2)}
.li .ico{width:36px;height:36px;border-radius:11px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;flex:none}
.li .t{font-weight:600;overflow-wrap:anywhere}
.ann{border-inline-start:4px solid var(--red);display:flex;flex-direction:column;gap:8px}
.ann h3{font:700 16px/1.3 var(--f-display)}
.ann p{overflow-wrap:anywhere}
.pcard{display:flex;flex-direction:column;gap:10px;width:100%;text-align:start}
.pcard h3{font:700 16px/1.3 var(--f-display);overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);width:var(--w,0%);border-radius:99px}
.av{width:var(--s,30px);height:var(--s,30px);border-radius:50%;background:var(--green);color:var(--on-green);display:inline-grid;place-items:center;font:700 13px var(--f-body);flex:none}
.av.y{background:var(--yellow);color:var(--on-yellow)}
.av.r{background:var(--red);color:#fff}

/* Bandeau d'invitation */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:30px 18px 28px;background:linear-gradient(var(--red),var(--red)) top/100% 8px no-repeat,linear-gradient(var(--red),var(--red)) bottom/100% 8px no-repeat,linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);display:flex;flex-direction:column;gap:10px}
.hero::before{content:"";position:absolute;inset:8px 0;pointer-events:none;background-image:
  repeating-linear-gradient(45deg,rgba(255,199,44,.3) 0 1.5px,transparent 1.5px 30px),
  repeating-linear-gradient(-45deg,rgba(255,199,44,.3) 0 1.5px,transparent 1.5px 30px)}
.hero>*{position:relative}
.hero h1{font:700 27px/1.12 var(--f-display);text-wrap:balance}
.hero .eyebrow{color:var(--hero-soft)}
.hero p{color:var(--hero-soft)}
.hero .logo{width:44px;height:44px}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:600;font-size:13px}
input[type=text],input[type=date],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:16px/1.4 var(--f-body)}
textarea{resize:vertical;min-height:84px}
.pfx{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding-inline-start:12px;color:var(--ink2);font-size:16px}
.pfx:focus-within{outline:2px solid var(--green)}
.pfx input{border:0;border-radius:0 12px 12px 0;background:transparent;outline:0}
[dir="rtl"] .pfx input{border-radius:12px 0 0 12px}
.fb{min-height:22px;font-size:13px}
.fb.ok{color:var(--green-ink)}
.fb.err{color:var(--red-ink)}
.pick{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer}
.pick:has(input:checked){border-color:var(--green-ink);background:var(--green-soft)}
.pick input{width:20px;height:20px;accent-color:var(--green-ink);flex:none}
.pick .ico{width:38px;height:38px;border-radius:12px;background:var(--surface2);color:var(--green-ink);display:grid;place-items:center;flex:none}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:600;text-align:center}
.seg [aria-pressed="true"],.seg [aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-weight:600;background:var(--surface)}
.tabs [aria-selected="true"]{background:var(--green);color:var(--on-green);border-color:var(--green-ink)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .15s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{inset-inline-start:21px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--yellow-soft);color:var(--yellow-ink);font-weight:500}
.banner.info{background:var(--green-soft);color:var(--green-ink)}
.linkbox{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}
.code{font:700 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;text-align:center;background:var(--surface2);border-radius:14px;padding:16px 10px;overflow-wrap:anywhere}

/* Projets */
.tk{display:flex;align-items:center;gap:10px;padding:10px 0}
.tk+.tk{border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2);flex:none}
.dot.doing{border-color:var(--yellow);background:var(--yellow)}
.dot.done{border-color:var(--green-ink);background:var(--green)}
.ms{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ms .dot{margin-top:5px}
.cmt{display:flex;gap:10px;padding:10px 0}
.cmt+.cmt{border-top:1px solid var(--line)}
.cmt p{overflow-wrap:anywhere}
.who{font-weight:600}
.rad{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;width:100%}
.rad[aria-checked="true"]{border-color:var(--green-ink);background:var(--green-soft)}
.rad .o{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink2);flex:none}
.rad[aria-checked="true"] .o{border-color:var(--green-ink);background:radial-gradient(var(--green) 45%,transparent 50%)}

/* Fenêtres */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.55);z-index:40}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;max-width:480px;margin-inline:auto;max-height:90%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.tall{height:90%}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.ico-lg{width:44px;height:44px;border-radius:13px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;flex:none}
.sheet-h h2{font:700 17px/1.25 var(--f-display)}
.sheet-b{overflow-y:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;inset-inline:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--green);color:var(--on-green);padding:10px 16px;border-radius:13px;box-shadow:var(--shadow);z-index:60;font-weight:500}

/* Simulation WhatsApp */
.chat{background:var(--surface2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:90%;background:var(--surface);border-radius:4px 14px 14px 14px;padding:8px 11px;box-shadow:var(--shadow);align-self:flex-start;min-width:0}
.bub.out{align-self:flex-end;background:var(--green-soft);border-radius:14px 4px 14px 14px}
.bub .who{font-size:12px;color:var(--green-ink)}
.bub p{overflow-wrap:anywhere}
.lc{margin-top:6px;border-inline-start:3px solid var(--green);background:var(--surface2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.lc b{font-weight:700}
.lc .url{font-size:12px;color:var(--ink2)}
.lc button{margin-top:6px;align-self:flex-start;font-weight:700;color:var(--green-ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* IA simulée */
.ai-card{border:1.5px dashed var(--green);background:var(--surface)}
.chip.ai{background:var(--green-soft);color:var(--green-ink)}
.tr-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.lnk{background:none;border:0;color:var(--green-ink);text-decoration:underline;font:600 13px var(--f-body);padding:4px;cursor:pointer}
.reply{border-inline-start:3px solid var(--green);padding:8px 10px;background:var(--green-soft);border-radius:10px;white-space:pre-line}
.bubble{background:var(--green-soft);border-radius:14px;padding:10px 12px;white-space:pre-line;color:var(--ink)}
.lcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--surface)}
.dg{margin:0;padding-inline-start:18px;display:grid;gap:6px}
.chat-ta{min-height:200px}
.bdgs{display:inline-flex;gap:4px;vertical-align:middle;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:0 7px;font:600 10.5px/17px var(--f-body);background:var(--surface2);color:var(--ink2);white-space:nowrap}
.bdg.green{background:var(--green-soft);color:var(--green-ink)}
.bdg.yellow{background:var(--yellow-soft);color:var(--yellow-ink)}
.bdg.red{background:var(--red-soft);color:var(--red-ink)}
.dots{color:var(--yellow-ink);font-size:11px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;min-height:92px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;text-align:start}
.tile:hover{background:var(--surface2)}
.tile .ico{width:36px;height:36px;border-radius:11px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center}
.lang-btn{font:700 14px var(--f-body)}
.li.done .t{color:var(--ink2);text-decoration:line-through}
.li.done .ico{background:var(--green);color:var(--on-green)}
.tabs{-webkit-mask-image:linear-gradient(to var(--end,right),#000 92%,transparent);mask-image:linear-gradient(to var(--end,right),#000 92%,transparent)}
[dir="rtl"] .tabs{--end:left}
</style>

</head>

function decorateFlags(el){
  if(!el||!S.flags)return;
  var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var pn=n.parentNode&&n.parentNode.nodeName;return (pn==='SCRIPT'||pn==='STYLE'||pn==='TEXTAREA'||pn==='OPTION'||pn==='TITLE')?NodeFilter.FILTER_REJECT:(n.nodeValue.indexOf('@')>-1?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT);}}),nodes=[],n;
  while((n=w.nextNode()))nodes.push(n);
  nodes.forEach(function(tn){
    var v=tn.nodeValue,re=/(^|[^\w.@])@([a-z0-9][a-z0-9._-]{2,23})/g,m,last=0,out=[],hit=false;
    while((m=re.exec(v))){
      var ps=m[2],f=S.flags[ps];if(!f){ps=ps.replace(/[._-]+$/,'');f=S.flags[ps];}
      if(!f)continue;
      var end=m.index+m[1].length+1+ps.length;out.push(v.slice(last,end),f);last=end;hit=true;re.lastIndex=end;
    }
    if(!hit)return;
    out.push(v.slice(last));
    var fr=document.createDocumentFragment();
    for(var i=0;i<out.length;i+=2){fr.appendChild(document.createTextNode(out[i]));if(i+1<out.length){var sp=document.createElement('span');sp.className='flg';sp.setAttribute('aria-hidden','true');sp.textContent=' '+out[i+1];fr.appendChild(sp);}}
    tn.parentNode.replaceChild(fr,tn);
  });
}

/* ============ Accès Supabase ============ */
var CFG=window.DIASPORACT_CONFIG||{};
var sb=null;
function client(){
  if(sb)return sb;
  if(!window.supabase||!CFG.url||!CFG.anonKey)return null;
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  return sb;
}
function q(p){return Promise.resolve(p).then(function(r){if(r.error)throw r.error;return r.data;});}
function pseudoMail(p){return String(p||'').trim().toLowerCase().replace(/^@/,'')+'@membre.diasporact.app';}
function errMsg(e){
  var m=String((e&&(e.message||e.error_description))||e||'');
  if(/invalid_invite/.test(m))return t('e_invite');
  if(/pseudo_taken|profiles_pseudo_key/.test(m))return t('e_taken');
  if(/bad_pseudo/.test(m))return t('pseudo_bad');
  if(/already_registered/.test(m))return t('e_already');
  if(/unknown_pseudo/.test(m))return t('e_unknown');
  if(/wa_link/.test(m))return t('wa_bad');
  if(/bad_code/.test(m))return t('e_code');
  if(/locked_code/.test(m))return t('e_locked');
  if(/need_password/.test(m))return t('secure_note');
  if(/Invalid login credentials/i.test(m))return t('e_login');
  if(/weak_password|at least \d+ char|Password should/i.test(m))return t('pw_short');
  if(/forbidden|row-level security|permission denied/.test(m))return t('e_denied');
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return t('e_net');
  return t('e_generic');
}

/* ============ Chargement des données ============ */
var refreshing=null;
function refresh(){
  if(refreshing)return refreshing;
  refreshing=doRefresh().then(function(r){refreshing=null;return r;},function(e){refreshing=null;throw e;});
  return refreshing;
}
function doRefresh(){
  var cl=client();
  return cl.auth.getSession().then(function(r){
    var ses=r.data&&r.data.session;if(!ses)return false;S.anon=!!(ses.user&&ses.user.is_anonymous);
    return q(cl.from('profiles').select('*').eq('auth_uid',ses.user.id).maybeSingle()).then(function(meRow){
      if(!meRow)return false;
      var id=meRow.id;
      return Promise.all([
        q(cl.from('canals').select('*').order('sort')),q(cl.from('canal_stats').select('*')),q(cl.from('canal_mods').select('*')),
        q(cl.from('public_profiles').select('*')),q(cl.from('canal_members').select('*')),
        q(cl.from('projects').select('*').order('created_at',{ascending:false})),q(cl.from('milestones').select('*').order('due')),
        q(cl.from('tasks').select('*')),q(cl.from('project_team').select('*')),q(cl.from('comments').select('*').order('created_at')),
        q(cl.from('helps').select('*').order('created_at',{ascending:false})),q(cl.from('announcements').select('*').order('created_at',{ascending:false})),
        q(cl.from('ann_reads').select('ann_id').eq('user_id',id)),q(cl.from('ann_read_counts').select('*')),
        q(cl.from('notifications').select('*').order('created_at',{ascending:false}).limit(50)),
        q(cl.from('badge_requests').select('*').eq('status','pending')),q(cl.from('badge_grants').select('*')),
        q(cl.from('engagement').select('*')),q(cl.from('skills_directory').select('*')),
        q(cl.from('follows').select('*').eq('user_id',id)),q(cl.from('proposals').select('*').eq('from_user',id)),
        q(cl.from('invites').select('*').eq('active',true).eq('kind','join').order('created_at'))
      ]).then(function(d){applyData(meRow,d);return true;});
    });
  });
}
function applyData(me,d){
  var canals=d[0],stats=d[1],mods=d[2],pubs=d[3],cms=d[4],projs=d[5],mss=d[6],tks=d[7],team=d[8],cmts=d[9],helps=d[10],anns=d[11],myReads=d[12],rcount=d[13],notifs=d[14],breqs=d[15],grants=d[16],eng=d[17],dir=d[18],fol=d[19],props=d[20],invs=d[21];
  var pp={};S.pubId={};S.honorOk={};pubs.forEach(function(p){pp[p.id]=p.pseudo;S.pubId[p.pseudo]=p.id;S.honorOk[p.pseudo]=p.show_honor!==false;});S.pub=pp;S.flags={};pubs.forEach(function(p){var f=flagFor(p.country);if(f)S.flags[p.pseudo]=f;});
  /* canaux */
  canals.forEach(function(row){var k=CANALS.filter(function(x){return x.id===row.id;})[0];
    if(!k){k={id:row.id,ico:row.ico,n:{fr:row.name_fr,ar:row.name_ar},d:{fr:row.desc_fr,ar:row.desc_ar}};CANALS.push(k);}
    var st=stats.filter(function(x){return x.canal_id===row.id;})[0],md=mods.filter(function(x){return x.canal_id===row.id&&x.is_moderator;})[0];
    k.count=st?+st.members:0;k.mod=md?md.pseudo:'';k.wa=row.wa_link||'';});
  /* moi */
  S.me={id:me.id,pseudo:me.pseudo,country:me.country||'',skills:me.skills||[],matching:!!me.matching,showHonor:me.show_honor!==false,admin:!!me.is_admin,mod:[],ref:(me.is_ref||me.is_admin)?DOMAINS.slice():[]};
  S.mem={};S.reqs={};S.cmem={};
  cms.forEach(function(m){
    if(m.user_id===me.id){if(m.status==='member'||m.status==='pending')S.mem[m.canal_id]=m.status;if(m.status==='member'&&m.is_moderator)S.me.mod.push(m.canal_id);}
    else if(m.status==='pending'){(S.reqs[m.canal_id]=S.reqs[m.canal_id]||[]).push({p:pp[m.user_id],id:m.user_id});}
    if(m.status==='member')(S.cmem[m.canal_id]=S.cmem[m.canal_id]||[]).push(pp[m.user_id]);
  });
  if(S.me.admin)CANALS.forEach(function(k){S.mem[k.id]='member';});
  /* rôles affichés sous les pseudos */
  S.roles={};function R(p){return S.roles[p]||(S.roles[p]={});}
  mods.forEach(function(m){var r=R(m.pseudo);if(m.is_moderator)(r.mod=r.mod||[]).push(m.canal_id);if(m.is_relay)r.relay=true;});
  pubs.forEach(function(p){if(p.is_ref)R(p.pseudo).ref=true;if(p.is_admin)R(p.pseudo).speaker=true;});
  S.grants={};grants.forEach(function(g){var p=pp[g.user_id];if(!p)return;var o=S.grants[p]=S.grants[p]||{};if(g.type==='relay')o.relay=true;else o.expert=g.type.split(':')[1];});
  S.badgeReqs=breqs.map(function(r){return {id:r.id,p:pp[r.user_id],type:r.type,note:r.note};});
  S.eng={};eng.forEach(function(e){var p=pp[e.user_id];if(p)S.eng[p]={reads:+e.reads,tasks:+e.tasks,proj:+e.proj,help:+e.help,links:+e.links};});
  S.dir=dir.filter(function(x){return x.id!==me.id;}).map(function(x){return {p:x.pseudo,c:x.country,sk:x.skills||[],open:true};});
  /* projets */
  S.archived=projs.filter(function(p){return p.archived_at&&isMod(p.canal_id);}).map(function(p){return {id:p.id,canal:p.canal_id,t:p.title,owner:pp[p.owner_id]};});
  S.projects=projs.filter(function(p){return !p.archived_at;}).map(function(p){
    var tm=team.filter(function(x){return x.project_id===p.id;}).map(function(x){return pp[x.user_id];}).filter(Boolean),ow=pp[p.owner_id];
    if(tm.indexOf(ow)<0)tm.unshift(ow);
    return {id:p.id,canal:p.canal_id,t:{fr:p.title,ar:p.title_ar||p.title},owner:ow,status:p.status,
      obj:{fr:p.objective,ar:p.objective_ar||p.objective,orig:p.orig_lang||'fr'},needs:p.needs||[],
      ms:mss.filter(function(m){return m.project_id===p.id;}).map(function(m){return {id:m.id,t:m.title,date:m.due||'',done:m.done};}),
      tasks:tks.filter(function(k){return k.project_id===p.id;}).map(function(k){return {id:k.id,t:k.title,status:k.status,who:k.assignee_id?pp[k.assignee_id]:null};}),
      team:tm,cmts:cmts.filter(function(m){return m.project_id===p.id;}).map(function(m){return {id:m.id,by:pp[m.author_id],t:m.body,at:Date.parse(m.created_at)};})};
  });
  /* entraide */
  S.helps=helps.map(function(h){return {id:h.id,who:pp[h.author_id],dom:h.domain,country:h.country,urgent:h.urgent,status:h.status,by:h.claimed_by?pp[h.claimed_by]:null,txt:h.body,reply:h.reply?{by:pp[h.claimed_by],txt:h.reply}:null};});
  /* annonces */
  var cnt={};rcount.forEach(function(x){cnt[x.ann_id]=+x.n;});
  S.read={};myReads.forEach(function(x){S.read[x.ann_id]=true;});
  S.anns=anns.map(function(a){return {id:a.id,canal:a.canal_id||'all',t:{fr:a.title,ar:a.title_ar||a.title},body:{fr:a.body,ar:a.body_ar||a.body,orig:a.orig_lang||'fr'},date:(a.created_at||'').slice(0,10),until:a.valid_until||'',reads:cnt[a.id]||0};});
  /* notifications */
  S.notifs=notifs.map(function(n){
    function tx(l,key,x){return I18N[l][key].split('{x}').join(x==null?'':x);}
    var o={id:n.id,type:'info',route:null,params:{},read:n.read,at:Date.parse(n.created_at)},k=n.kind,pj=projOf(n.ref)||{};
    if(k==='welcome'){o.fr=tx('fr','n_welcome');o.ar=tx('ar','n_welcome');o.route='home';}
    else if(k==='accepted'){var cn=canalOf(n.ref).n;o.type='canal';o.fr=tx('fr','n_acc',cn.fr);o.ar=tx('ar','n_acc',cn.ar);o.route='canal';o.params={id:n.ref};}
    else if(k==='task'){o.type='task';o.fr=tx('fr','n_task',n.body);o.ar=tx('ar','n_task',n.body);o.route='project';o.params={id:n.ref};}
    else if(k==='comment'){o.fr=tx('fr','n_cmt',n.body);o.ar=tx('ar','n_cmt',n.body);o.route='project';o.params={id:n.ref};}
    else if(k==='milestone'){o.fr=tx('fr','n_mil',n.body);o.ar=tx('ar','n_mil',n.body);o.route='project';o.params={id:n.ref};}
    else if(k==='proposal'){o.type='task';o.fr=tx('fr','n_prop',n.body);o.ar=tx('ar','n_prop',n.body);o.route='project';o.params={id:n.ref};}
    else if(k==='joined'){o.fr=tx('fr','n_joined',n.body);o.ar=tx('ar','n_joined',n.body);o.route='project';o.params={id:n.ref};}
    else if(k==='claimed'){o.type='help';o.fr=tx('fr','n_claim',n.body);o.ar=tx('ar','n_claim',n.body);o.route='help';}
    else{o.fr=n.body;o.ar=n.body;}
    return o;});
  /* invitations actives (visibles seulement des modérateurs) */
  S.invites={};invs.forEach(function(i){S.invites[i.canal_id]=i.code;});
  /* suivi, propositions */
  S.follow={};fol.forEach(function(f){S.follow[f.project_id]=f.level==='mine'?'milestones':f.level;});
  S.proposed={};props.forEach(function(x){S.proposed[x.project_id+'|'+pp[x.to_user]]=true;});
}
/* Écriture : exécute l'appel, recharge les données, réaffiche. */
function mut(fn,ok,after){
  if(S.busy)return Promise.resolve();S.busy=true;
  return Promise.resolve().then(fn).then(function(r){return refresh().then(function(){return r;});}).then(function(r){
    S.busy=false;if(after)after(r);render();if(ok)toast(typeof ok==='function'?ok(r):t(ok));
  }).catch(function(e){S.busy=false;toast(errMsg(e));render();});
}

/* ============ Vues et fonctions de la version réelle ============ */
function trBlock(key,o){
  var s=typeof o==='string'?o:(o[S.lang]||o.fr||'');
  return '<p dir="'+(/[؀-ۿ]/.test(s)?'rtl':'ltr')+'" style="white-space:pre-line">'+esc(s)+'</p>';
}
function canEdit(p){return hasAccount()&&(p.owner===S.me.pseudo||isMod(p.canal));}
function matchNeed(pj){
  var out=[],used={};
  pj.needs.forEach(function(n){var cn=concepts(n);if(!cn.length)return;
    for(var i=0;i<S.dir.length;i++){var m=S.dir[i];if(used[m.p]||pj.team.indexOf(m.p)>-1||pj.owner===m.p)continue;
      var sk=m.sk.filter(function(x){return overlap(cn,concepts(x)).length;})[0];
      if(sk){used[m.p]=1;out.push({need:n,m:m,skill:sk});break;}}});
  return out.slice(0,4);
}
function matchSection(pj,inTeam){
  if(!inTeam)return '';
  var sg=matchNeed(pj);
  return '<section class="card stack s8" id="match"><h2 class="h3">'+T('match_title')+'</h2><p class="muted small">'+T('match_note')+'</p>'+
  (sg.length?sg.map(function(g){var done=S.proposed[pj.id+'|'+g.m.p];
    return '<div class="li" style="align-items:flex-start">'+av(g.m.p)+'<span class="grow"><span class="t">@'+esc(g.m.p)+'</span>'+pBadges(g.m.p)+' <span class="muted small">· '+esc(g.m.c||'')+'</span><br><span class="muted small">'+T('match_why',{s:g.skill,n:g.need})+'</span></span>'+
    (done?chip(ic('check',14)+T('match_done'),'green'):'<button class="btn sm" data-act="propose" data-id="'+esc(pj.id)+'" data-p="'+esc(g.m.p)+'">'+T('match_prop')+'</button>')+'</div>';}).join(''):'<p class="empty">'+T('match_none')+'</p>')+'</section>';
}
function statsOf(p){var b=S.eng[p]||{};return {reads:b.reads||0,tasks:b.tasks||0,proj:b.proj||0,help:b.help||0,links:b.links||0};}
function checkBadges(){return false;}
function roleOf(p){var r={},b=S.roles[p]||{};if(b.speaker)r.speaker=true;if(b.mod&&b.mod.length)r.mod=b.mod;if(b.ref)r.ref=true;if(b.relay)r.relay=true;var g=S.grants[p]||{};if(g.expert)r.expert=g.expert;if(g.relay)r.relay=true;return r;}

function updatePseudo(){
  var inp=$('#pseudo');if(!inp)return;var v=inp.value.trim().toLowerCase(),fb=$('#pseudo-fb'),go=$('#pseudo-go');S.draft.pseudo=inp.value;
  fb.className='fb';go.disabled=true;clearTimeout(pseudoTimer);
  if(!v){fb.textContent='';return;}
  if(!/^[a-z0-9][a-z0-9._-]{2,23}$/.test(v)){fb.classList.add('err');fb.textContent=t('pseudo_bad');return;}
  fb.textContent=t('pseudo_check');var my=++pseudoSeq;
  pseudoTimer=setTimeout(function(){
    q(client().rpc('pseudo_available',{p:v})).then(function(ok){
      if(my!==pseudoSeq||!$('#pseudo'))return;fb=$('#pseudo-fb');fb.className='fb';
      if(ok){fb.classList.add('ok');fb.textContent='✓ '+t('pseudo_ok',{p:v});$('#pseudo-go').disabled=false;}
      else{fb.classList.add('err');fb.innerHTML=esc(t('pseudo_taken',{p:v}))+' '+[v+'.mr',v+'_'+new Date().getFullYear()].filter(function(s){return s.length<=24;}).map(function(s){return '<button type="button" class="chip" data-act="sug" data-v="'+esc(s)+'">@'+esc(s)+'</button>';}).join(' ');}
    }).catch(function(){if(my!==pseudoSeq)return;var f=$('#pseudo-fb');if(f){f.className='fb err';f.textContent=t('e_net');}});
  },350);
}

  openSheet(t('sc_show'),'<p class="linkbox" dir="ltr" style="font-size:22px;letter-spacing:1px;text-align:center;font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere">'+esc(g)+'</p><p class="muted small">'+T('sc_keep')+'</p><div class="row wrap"><button class="btn grow" data-act="copy-msg">'+ic('copy',18)+T('sc_copy')+'</button><button class="btn primary grow" data-act="close-sheet">'+T('sc_done')+'</button></div>');
}

/* ============ Démarrage ============ */
function hashInfo(){var m=(location.hash||'').match(/^#\/(i|p|a)\/([^\/?#]+)/);return m?{k:m[1],v:decodeURIComponent(m[2])}:null;}
function clearHash(){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
function goHome(){
  S.stack=[];var h=S.deep;S.deep=null;
  S.route=(h&&h.k==='p'&&projOf(h.v))?{name:'project',params:{id:h.v}}:{name:'home',params:{}};
  render(true);
}
function startOnboarding(code){
  S.auth.err='';var cl=client();
  return cl.auth.getSession().then(function(r){
    if(r.data.session)return;
    return cl.auth.signInAnonymously().then(function(x){if(x.error)throw x.error;});
  }).then(function(){return rpc('peek_invite',{p_code:code});}).then(function(pk){
    if(!pk){S.auth={code:null,peek:null,err:t('e_invite')};S.route={name:'inv0',params:{}};}
    else{S.auth={code:code,peek:pk,err:''};S.route={name:pk.kind==='recovery'?'invRec':'inv1',params:{}};}
    render(true);
  }).catch(function(e){S.auth={code:null,peek:null,err:errMsg(e)};S.route={name:'inv0',params:{}};render(true);});
}
function inviteWhileRegistered(code){
  return rpc('peek_invite',{p_code:code}).then(function(pk){
    if(!pk)throw new Error('invalid_invite');
    if(pk.kind==='join'&&pk.canal){return rpc('redeem_invite',{p_code:code}).then(refresh).then(function(){clearHash();goHome();S.route={name:'canal',params:{id:pk.canal}};render(true);toast(t('joined',{x:c({fr:pk.canal_fr,ar:pk.canal_ar})}));});}
    clearHash();goHome();toast(t('e_already'));
  }).catch(function(e){clearHash();goHome();toast(errMsg(e));});
}
function boot(){
  render(true);
  if(!client()){S.fatal=t('cfg_missing');render(true);return;}
  var h=hashInfo();
  client().auth.getSession().then(function(r){return r.data.session?refresh():false;}).then(function(ok){
    if(ok){if(h&&h.k==='i')return inviteWhileRegistered(h.v);S.deep=(h&&h.k==='p')?h:null;goHome();return;}
    if(h&&h.k==='i')return startOnboarding(h.v);
    S.route={name:'inv0',params:{}};render(true);
  }).catch(function(e){S.fatal=errMsg(e);render(true);});
  window.addEventListener('hashchange',function(){if(/^#\/i\//.test(location.hash))location.reload();});
  setInterval(function(){
    if(document.hidden||!hasAccount()||S.busy)return;
    var a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(!$('#sheets').hidden)return;
    refresh().then(function(){render();}).catch(function(){});
  },60000);
}


boot();
})();
